<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560">
  <defs>
    <filter id="sh" x="-18%" y="-12%" width="136%" height="136%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(0,0,0,0.42)"/>
    </filter>
    <radialGradient id="g" cx="42%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d93030"/>
      <stop offset="100%" stop-color="#8a1414"/>
    </radialGradient>
    <radialGradient id="hook" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#f0d048"/>
      <stop offset="60%" stop-color="#c49a20"/>
      <stop offset="100%" stop-color="#7a5a10"/>
    </radialGradient>
  </defs>

  <!-- Suspension wires -->
  <line x1="250" y1="57" x2="148" y2="133" stroke="#a8a8a8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="57" x2="352" y2="133" stroke="#a8a8a8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sign body -->
  <path d="M 25,535 L 475,535 Q 497,535 497,513 L 497,265 A 247,165 0 0,0 3,265 L 3,513 Q 3,535 25,535 Z"
        fill="url(#g)" filter="url(#sh)"/>

  <!-- Top arch highlight -->
  <path d="M 492,268 A 242,158 0 0,0 8,268 L 8,274 A 242,158 0 0,1 492,274 Z"
        fill="rgba(255,255,255,0.12)"/>

  <!-- Bottom shadow strip -->
  <path d="M 25,535 L 475,535 Q 497,535 497,513 L 497,505 Q 497,527 475,527 L 25,527 Q 3,527 3,505 L 3,513 Q 3,535 25,535 Z"
        fill="rgba(0,0,0,0.18)"/>

  <!-- Gold hook -->
  <circle cx="250" cy="35" r="27" fill="url(#hook)"/>
  <circle cx="244" cy="29" r="7" fill="rgba(255,255,255,0.35)"/>

  <!-- Wire attachment rings -->
  <circle cx="148" cy="136" r="11" fill="none" stroke="#c0c0c0" stroke-width="3"/>
  <circle cx="352" cy="136" r="11" fill="none" stroke="#c0c0c0" stroke-width="3"/>

  <!-- PIZZA OVEN ICON (white) -->
  <!-- Chimney cap -->
  <rect x="222" y="142" width="56" height="15" rx="4" fill="white"/>
  <!-- Chimney shaft -->
  <rect x="235" y="157" width="30" height="52" rx="3" fill="white"/>

  <!-- Oven body ring: outer arch minus inner arch (evenodd = hollow centre) -->
  <path fill-rule="evenodd"
        d="M 130,385 L 130,315 Q 130,210 250,210 Q 370,210 370,315 L 370,385 Z
           M 166,385 L 166,320 Q 166,254 250,254 Q 334,254 334,320 L 334,385 Z"
        fill="white"/>

  <!-- Flame inside opening -->
  <path d="M 250,374 C 234,342 229,316 250,290 C 271,316 266,342 250,374 Z" fill="white"/>

  <!-- Hearth slab -->
  <rect x="112" y="383" width="276" height="28" rx="5" fill="white"/>

  <!-- Legs -->
  <rect x="143" y="409" width="22" height="14" rx="3" fill="white"/>
  <rect x="335" y="409" width="22" height="14" rx="3" fill="white"/>

  <!-- TEXT -->
  <text x="250" y="480"
        text-anchor="middle"
        font-family="'Arial Black', Arial, sans-serif"
        font-weight="900"
        font-size="52"
        fill="white"
        letter-spacing="3">&#x2014;Z&#193;RVA&#x2014;</text>
</svg>
